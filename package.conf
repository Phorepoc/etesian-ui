# package.conf -- how the pdk package.yml builds this repository SIS files: the Etesian shell (Home, launcher, dialler, shell chooser). Plain Avkon/CONE C++: no Qt, no engine.
NAME=etesian-ui
ARCHES="arm x32"
IMAGE=ghcr.io/phorepoc/base
COMPONENTS_arm="etesianlaunch etesianhome etesianshell etesianphone etesiantheme"
COMPONENTS_x32="etesianlaunch etesianhome etesianshell etesianphone etesiantheme"
ADDON=0
